<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#071A2E" />
    <meta name="description" content="SALINK — Smart Alert, Link & Integrated Notification Knowledge. Platform darurat berbasis komunitas." />
    <title>SALINK — Emergency Social Platform</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

    <style>
        /* ================================================================
           SALINK DESIGN SYSTEM — All in One
           ================================================================ */

        /* ---------- TOKENS ---------- */
        :root {
            --sl-color-primary: #00C2FF;
            --sl-color-primary-hover: #33D0FF;
            --sl-color-primary-active: #0099CC;
            --sl-color-success: #00C853;
            --sl-color-success-bg: #E8F5E9;
            --sl-color-warning: #FFC107;
            --sl-color-warning-bg: #FFF8E1;
            --sl-color-danger: #FF3B30;
            --sl-color-danger-hover: #FF6259;
            --sl-color-danger-bg: #FFEBEE;
            --sl-color-bg: #071A2E;
            --sl-color-surface: #0B223D;
            --sl-color-card: #12385E;
            --sl-color-card-hover: #1A4670;
            --sl-color-text-primary: #FFFFFF;
            --sl-color-text-secondary: #B0C4DE;
            --sl-color-text-muted: #6A8BA0;
            --sl-color-border: rgba(255, 255, 255, 0.08);
            --sl-color-border-light: rgba(255, 255, 255, 0.15);
            --sl-glass-bg: rgba(255, 255, 255, 0.06);
            --sl-glass-border: rgba(255, 255, 255, 0.10);
            --sl-font-primary: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            --sl-font-size-xs: 10px;
            --sl-font-size-sm: 12px;
            --sl-font-size-md: 14px;
            --sl-font-size-lg: 16px;
            --sl-font-size-xl: 20px;
            --sl-font-size-2xl: 24px;
            --sl-font-weight-medium: 500;
            --sl-font-weight-bold: 700;
            --sl-line-height-normal: 1.5;
            --sl-spacing-1: 4px;
            --sl-spacing-2: 8px;
            --sl-spacing-3: 12px;
            --sl-spacing-4: 16px;
            --sl-spacing-5: 20px;
            --sl-spacing-6: 24px;
            --sl-radius-sm: 8px;
            --sl-radius-md: 12px;
            --sl-radius-lg: 16px;
            --sl-radius-xl: 24px;
            --sl-radius-full: 9999px;
            --sl-shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.15);
            --sl-shadow-md: 0 4px 16px rgba(0, 0, 0, 0.20);
            --sl-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.25);
            --sl-shadow-emergency: 0 0 60px rgba(255, 59, 48, 0.20);
            --sl-duration-fast: 150ms;
            --sl-duration-normal: 300ms;
            --sl-duration-slow: 500ms;
            --sl-ease-default: cubic-bezier(0.4, 0, 0.2, 1);
            --sl-ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --sl-z-base: 0;
            --sl-z-header: 50;
            --sl-z-sidebar: 60;
            --sl-z-bottom-nav: 70;
            --sl-z-fab: 80;
            --sl-z-drawer: 100;
            --sl-z-modal: 200;
            --sl-z-toast: 300;
            --sl-z-loader: 400;
            --sl-z-emergency-overlay: 500;
            --sl-touch-target-min: 44px;
            --sl-transition-all: all var(--sl-duration-normal) var(--sl-ease-default);
            --sl-transition-color: color var(--sl-duration-normal) var(--sl-ease-default);
        }

        [data-theme="light"] {
            --sl-color-bg: #F0F4F8;
            --sl-color-surface: #FFFFFF;
            --sl-color-card: #E8EEF2;
            --sl-color-card-hover: #D8E0E8;
            --sl-color-text-primary: #0D1B2A;
            --sl-color-text-secondary: #2C3E50;
            --sl-color-text-muted: #5A7A8C;
            --sl-color-border: rgba(0, 0, 0, 0.08);
            --sl-glass-bg: rgba(255, 255, 255, 0.6);
            --sl-glass-border: rgba(255, 255, 255, 0.3);
        }

        [data-theme="emergency"] {
            --sl-color-bg: #1A0000;
            --sl-color-surface: #2A0000;
            --sl-color-card: #3A0000;
            --sl-color-text-primary: #FFFFFF;
            --sl-color-text-secondary: #FFCDD2;
            --sl-color-primary: #FF1744;
            --sl-color-border: rgba(255, 59, 48, 0.3);
            --sl-shadow-emergency: 0 0 80px rgba(255, 59, 48, 0.15);
        }

        /* ---------- RESET ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--sl-font-primary);
            background: var(--sl-color-bg);
            color: var(--sl-color-text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ---------- SPLASH SCREEN ---------- */
        #sl-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--sl-color-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--sl-spacing-4);
            transition: opacity var(--sl-duration-slow) var(--sl-ease-default);
        }

        #sl-splash.hide {
            opacity: 0;
            pointer-events: none;
        }

        #sl-splash .sl-splash-logo {
            font-size: 48px;
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
            letter-spacing: -1px;
        }

        #sl-splash .sl-splash-sub {
            font-size: var(--sl-font-size-sm);
            color: var(--sl-color-text-muted);
        }

        #sl-splash .sl-splash-loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--sl-color-primary);
            border-radius: 50%;
            animation: sl-spin 0.8s linear infinite;
        }

        @keyframes sl-spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- APP SHELL ---------- */
        #sl-app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background: var(--sl-color-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: var(--sl-shadow-lg);
        }

        /* ---------- SYSTEM BAR ---------- */
        #sl-system-bar {
            display: flex;
            justify-content: space-between;
            padding: 2px var(--sl-spacing-4);
            font-size: var(--sl-font-size-xs);
            color: var(--sl-color-text-secondary);
            background: rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        #sl-status-text {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-1);
        }

        #sl-status-text::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--sl-color-success);
        }

        /* ---------- HEADER ---------- */
        #sl-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--sl-spacing-3) var(--sl-spacing-4);
            background: var(--sl-color-surface);
            border-bottom: 1px solid var(--sl-color-border);
            flex-shrink: 0;
        }

        .sl-header-left {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-2);
        }

        #sl-logo {
            font-weight: var(--sl-font-weight-bold);
            font-size: var(--sl-font-size-lg);
            color: var(--sl-color-text-primary);
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-1);
        }

        #sl-logo svg {
            width: 24px;
            height: 24px;
            fill: var(--sl-color-primary);
        }

        .sl-header-right {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-2);
        }

        .sl-icon-btn {
            background: transparent;
            border: none;
            color: var(--sl-color-text-secondary);
            cursor: pointer;
            padding: var(--sl-spacing-1);
            transition: var(--sl-transition-color);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: var(--sl-radius-full);
        }

        .sl-icon-btn:hover {
            color: var(--sl-color-text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .sl-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- SEARCH ---------- */
        #sl-search-bar {
            padding: var(--sl-spacing-2) var(--sl-spacing-4);
            background: var(--sl-color-surface);
            border-bottom: 1px solid var(--sl-color-border);
            flex-shrink: 0;
            display: none;
        }

        #sl-search-bar.active {
            display: block;
        }

        .sl-search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .sl-search-input-wrap svg {
            position: absolute;
            left: var(--sl-spacing-3);
            width: 18px;
            height: 18px;
            fill: var(--sl-color-text-muted);
            stroke: var(--sl-color-text-muted);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sl-search-input {
            width: 100%;
            padding: var(--sl-spacing-2) var(--sl-spacing-3) var(--sl-spacing-2) 40px;
            background: var(--sl-color-bg);
            border: 2px solid var(--sl-color-border);
            border-radius: var(--sl-radius-full);
            color: var(--sl-color-text-primary);
            font-size: var(--sl-font-size-md);
            font-family: var(--sl-font-primary);
            min-height: var(--sl-touch-target-min);
            transition: var(--sl-transition-all);
        }

        .sl-search-input::placeholder {
            color: var(--sl-color-text-muted);
        }

        .sl-search-input:focus {
            outline: none;
            border-color: var(--sl-color-primary);
            box-shadow: 0 0 0 4px rgba(0, 194, 255, 0.1);
        }

        /* ---------- WORKSPACE ---------- */
        #sl-workspace {
            flex: 1;
            overflow-y: auto;
            padding: var(--sl-spacing-4);
            position: relative;
            scroll-behavior: smooth;
        }

        #sl-workspace::-webkit-scrollbar {
            width: 4px;
        }

        #sl-workspace::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--sl-radius-full);
        }

        /* ---------- LOADER ---------- */
        .sl-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 200px;
            gap: var(--sl-spacing-4);
            color: var(--sl-color-text-secondary);
        }

        .sl-loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--sl-color-primary);
            border-radius: 50%;
            animation: sl-spin 0.8s linear infinite;
        }

        .sl-loader-progress {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--sl-radius-full);
            overflow: hidden;
        }

        .sl-loader-progress-bar {
            height: 100%;
            background: var(--sl-color-primary);
            border-radius: var(--sl-radius-full);
            transition: width var(--sl-duration-slow) var(--sl-ease-default);
            width: 0%;
        }

        /* ---------- HERO ---------- */
        .sl-hero {
            background: linear-gradient(135deg, var(--sl-color-card), var(--sl-color-surface));
            border-radius: var(--sl-radius-lg);
            padding: var(--sl-spacing-4);
            margin-bottom: var(--sl-spacing-4);
            border: 1px solid var(--sl-color-border);
            position: relative;
            overflow: hidden;
        }

        .sl-hero::after {
            content: "";
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 194, 255, 0.08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .sl-hero-title {
            font-size: var(--sl-font-size-xl);
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
            margin-bottom: var(--sl-spacing-1);
        }

        .sl-hero-sub {
            font-size: var(--sl-font-size-sm);
            color: var(--sl-color-text-secondary);
        }

        .sl-hero-status {
            display: inline-flex;
            align-items: center;
            gap: var(--sl-spacing-2);
            margin-top: var(--sl-spacing-3);
            padding: var(--sl-spacing-1) var(--sl-spacing-3);
            background: rgba(0, 200, 83, 0.15);
            border-radius: var(--sl-radius-full);
            font-size: var(--sl-font-size-xs);
            color: var(--sl-color-success);
        }

        /* ---------- STATISTICS ---------- */
        .sl-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--sl-spacing-2);
            margin-bottom: var(--sl-spacing-4);
        }

        .sl-stat-item {
            background: var(--sl-color-card);
            border-radius: var(--sl-radius-md);
            padding: var(--sl-spacing-2) var(--sl-spacing-1);
            text-align: center;
            border: 1px solid var(--sl-color-border);
            transition: var(--sl-transition-all);
            cursor: default;
        }

        .sl-stat-item:hover {
            border-color: var(--sl-color-border-light);
        }

        .sl-stat-value {
            font-size: var(--sl-font-size-xl);
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
        }

        .sl-stat-label {
            font-size: var(--sl-font-size-xs);
            color: var(--sl-color-text-muted);
            margin-top: 2px;
        }

        /* ---------- CREATE POST ---------- */
        .sl-create-post {
            background: var(--sl-color-card);
            border-radius: var(--sl-radius-lg);
            padding: var(--sl-spacing-3);
            border: 1px solid var(--sl-color-border);
            margin-bottom: var(--sl-spacing-4);
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-3);
            cursor: pointer;
            transition: var(--sl-transition-all);
        }

        .sl-create-post:hover {
            border-color: var(--sl-color-border-light);
            background: var(--sl-color-card-hover);
        }

        .sl-create-post-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--sl-radius-full);
            background: var(--sl-color-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
            flex-shrink: 0;
            font-size: var(--sl-font-size-lg);
        }

        .sl-create-post-placeholder {
            flex: 1;
            color: var(--sl-color-text-muted);
            font-size: var(--sl-font-size-md);
        }

        .sl-create-post-actions {
            display: flex;
            gap: var(--sl-spacing-2);
        }

        .sl-create-post-actions button {
            background: transparent;
            border: none;
            color: var(--sl-color-text-secondary);
            cursor: pointer;
            padding: var(--sl-spacing-1);
            border-radius: var(--sl-radius-full);
            transition: var(--sl-transition-all);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }

        .sl-create-post-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--sl-color-text-primary);
        }

        .sl-create-post-actions button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- STORY ---------- */
        .sl-story-section {
            margin-bottom: var(--sl-spacing-4);
        }

        .sl-story-section-title {
            font-size: var(--sl-font-size-sm);
            font-weight: var(--sl-font-weight-medium);
            color: var(--sl-color-text-secondary);
            margin-bottom: var(--sl-spacing-2);
        }

        .sl-story-list {
            display: flex;
            gap: var(--sl-spacing-3);
            overflow-x: auto;
            padding-bottom: var(--sl-spacing-2);
            -webkit-overflow-scrolling: touch;
        }

        .sl-story-list::-webkit-scrollbar {
            height: 2px;
        }

        .sl-story-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--sl-radius-full);
        }

        .sl-story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--sl-spacing-1);
            cursor: pointer;
            flex-shrink: 0;
        }

        .sl-story-avatar {
            width: 56px;
            height: 56px;
            border-radius: var(--sl-radius-full);
            background: var(--sl-color-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--sl-font-size-xl);
            border: 2px solid var(--sl-color-primary);
            padding: 2px;
            color: var(--sl-color-text-primary);
        }

        .sl-story-name {
            font-size: var(--sl-font-size-xs);
            color: var(--sl-color-text-secondary);
            max-width: 64px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        /* ---------- FEED ---------- */
        .sl-feed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--sl-spacing-4);
            flex-wrap: wrap;
            gap: var(--sl-spacing-2);
        }

        .sl-feed-title {
            font-size: var(--sl-font-size-xl);
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
        }

        .sl-feed-filters {
            display: flex;
            gap: var(--sl-spacing-2);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: var(--sl-spacing-1);
        }

        .sl-feed-filter {
            padding: var(--sl-spacing-1) var(--sl-spacing-3);
            border-radius: var(--sl-radius-full);
            border: 1px solid var(--sl-color-border);
            background: transparent;
            color: var(--sl-color-text-secondary);
            font-size: var(--sl-font-size-sm);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--sl-transition-all);
            font-family: var(--sl-font-primary);
        }

        .sl-feed-filter:hover {
            border-color: var(--sl-color-primary);
            color: var(--sl-color-text-primary);
        }

        .sl-feed-filter.active {
            background: var(--sl-color-primary);
            border-color: var(--sl-color-primary);
            color: #fff;
        }

        /* ---------- POST COMPOSER ---------- */
        .sl-post-composer {
            background: var(--sl-color-card);
            border-radius: var(--sl-radius-lg);
            padding: var(--sl-spacing-4);
            border: 1px solid var(--sl-color-border);
            margin-bottom: var(--sl-spacing-4);
            display: none;
        }

        .sl-post-composer.active {
            display: block;
        }

        .sl-post-composer-header {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-3);
            margin-bottom: var(--sl-spacing-3);
        }

        .sl-post-composer-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--sl-radius-full);
            background: var(--sl-color-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
            flex-shrink: 0;
            font-size: var(--sl-font-size-lg);
        }

        .sl-post-composer-input {
            flex: 1;
            background: var(--sl-color-surface);
            border: 2px solid var(--sl-color-border);
            border-radius: var(--sl-radius-full);
            padding: var(--sl-spacing-2) var(--sl-spacing-4);
            color: var(--sl-color-text-primary);
            font-family: var(--sl-font-primary);
            font-size: var(--sl-font-size-md);
            min-height: 44px;
            transition: var(--sl-transition-all);
            resize: none;
        }

        .sl-post-composer-input:focus {
            outline: none;
            border-color: var(--sl-color-primary);
            box-shadow: 0 0 0 4px rgba(0, 194, 255, 0.1);
        }

        .sl-post-composer-input::placeholder {
            color: var(--sl-color-text-muted);
        }

        .sl-post-composer-actions {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-2);
            flex-wrap: wrap;
        }

        .sl-post-composer-type {
            padding: var(--sl-spacing-1) var(--sl-spacing-3);
            border-radius: var(--sl-radius-full);
            border: 1px solid var(--sl-color-border);
            background: var(--sl-color-surface);
            color: var(--sl-color-text-secondary);
            font-size: var(--sl-font-size-sm);
            cursor: pointer;
            font-family: var(--sl-font-primary);
            min-height: 36px;
            transition: var(--sl-transition-all);
        }

        .sl-post-composer-type:hover {
            border-color: var(--sl-color-primary);
            color: var(--sl-color-text-primary);
        }

        .sl-post-composer-type option {
            background: var(--sl-color-surface);
            color: var(--sl-color-text-primary);
        }

        .sl-post-composer-type.emergency {
            border-color: var(--sl-color-danger);
            color: var(--sl-color-danger);
        }

        .sl-post-composer-submit {
            margin-left: auto;
        }

        /* ---------- POST CARD ---------- */
        .sl-post-card {
            background: var(--sl-color-card);
            border-radius: var(--sl-radius-lg);
            padding: var(--sl-spacing-4);
            border: 1px solid var(--sl-color-border);
            margin-bottom: var(--sl-spacing-4);
            transition: var(--sl-transition-all);
        }

        .sl-post-card:hover {
            border-color: var(--sl-color-border-light);
        }

        .sl-post-header {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-3);
            margin-bottom: var(--sl-spacing-3);
        }

        .sl-post-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--sl-radius-full);
            background: var(--sl-color-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
            flex-shrink: 0;
            font-size: var(--sl-font-size-lg);
        }

        .sl-post-author {
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
        }

        .sl-post-time {
            font-size: var(--sl-font-size-xs);
            color: var(--sl-color-text-muted);
        }

        .sl-post-content {
            color: var(--sl-color-text-secondary);
            line-height: var(--sl-line-height-normal);
            margin-bottom: var(--sl-spacing-3);
            font-size: var(--sl-font-size-md);
        }

        .sl-post-media {
            border-radius: var(--sl-radius-md);
            overflow: hidden;
            margin-bottom: var(--sl-spacing-3);
            background: var(--sl-color-surface);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .sl-post-actions {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-1);
            padding-top: var(--sl-spacing-3);
            border-top: 1px solid var(--sl-color-border);
            flex-wrap: wrap;
        }

        .sl-post-action {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-1);
            background: none;
            border: none;
            color: var(--sl-color-text-secondary);
            font-size: var(--sl-font-size-sm);
            cursor: pointer;
            padding: var(--sl-spacing-1) var(--sl-spacing-2);
            border-radius: var(--sl-radius-sm);
            transition: var(--sl-transition-all);
            font-family: var(--sl-font-primary);
            min-height: 32px;
        }

        .sl-post-action:hover {
            background: var(--sl-color-surface);
            color: var(--sl-color-text-primary);
        }

        .sl-post-action.liked {
            color: var(--sl-color-danger);
        }

        .sl-post-action svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sl-post-action.liked svg {
            fill: var(--sl-color-danger);
            stroke: var(--sl-color-danger);
        }

        .sl-post-action .sl-action-count {
            font-size: var(--sl-font-size-sm);
        }

        /* ---------- EMERGENCY CARD ---------- */
        .sl-emergency-card {
            background: var(--sl-color-card);
            border-radius: var(--sl-radius-lg);
            padding: var(--sl-spacing-4);
            border-left: 4px solid var(--sl-color-danger);
            margin-bottom: var(--sl-spacing-4);
            border: 1px solid var(--sl-color-border);
            border-left-width: 4px;
        }

        .sl-emergency-card .sl-post-header {
            margin-bottom: var(--sl-spacing-2);
        }

        .sl-emergency-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--sl-spacing-1);
            padding: var(--sl-spacing-0_5) var(--sl-spacing-2);
            background: var(--sl-color-danger);
            color: #fff;
            border-radius: var(--sl-radius-full);
            font-size: var(--sl-font-size-xs);
            font-weight: var(--sl-font-weight-bold);
        }

        .sl-emergency-status {
            font-size: var(--sl-font-size-xs);
            color: var(--sl-color-text-muted);
        }

        /* ---------- QUICK ACTION ---------- */
        .sl-quick-action {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--sl-spacing-2);
            margin-bottom: var(--sl-spacing-4);
        }

        .sl-quick-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--sl-spacing-1);
            padding: var(--sl-spacing-2);
            background: var(--sl-color-card);
            border-radius: var(--sl-radius-md);
            border: 1px solid var(--sl-color-border);
            color: var(--sl-color-text-secondary);
            cursor: pointer;
            transition: var(--sl-transition-all);
            font-family: var(--sl-font-primary);
            font-size: var(--sl-font-size-xs);
            min-height: 64px;
        }

        .sl-quick-action-btn:hover {
            border-color: var(--sl-color-border-light);
            background: var(--sl-color-card-hover);
            color: var(--sl-color-text-primary);
            transform: translateY(-2px);
        }

        .sl-quick-action-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sl-quick-action-btn .sl-icon-emoji {
            font-size: 24px;
        }

        /* ---------- EMERGENCY GRID ---------- */
        .sl-emergency-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--sl-spacing-4);
            margin-bottom: var(--sl-spacing-4);
        }

        .sl-emergency-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--sl-spacing-2);
            padding: var(--sl-spacing-5) var(--sl-spacing-3);
            border-radius: var(--sl-radius-lg);
            border: none;
            font-size: var(--sl-font-size-md);
            font-weight: var(--sl-font-weight-bold);
            cursor: pointer;
            transition: var(--sl-transition-all);
            min-height: 120px;
            font-family: var(--sl-font-primary);
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .sl-emergency-btn .sl-icon-emoji {
            font-size: 48px;
        }

        .sl-emergency-btn .sl-label {
            font-size: var(--sl-font-size-md);
        }

        .sl-emergency-btn:hover {
            transform: scale(1.02);
            box-shadow: var(--sl-shadow-lg);
        }

        .sl-emergency-btn:active {
            transform: scale(0.95);
        }

        .sl-emergency-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.08), transparent 60%);
            pointer-events: none;
        }

        .sl-emergency-fire {
            background: linear-gradient(135deg, #FF3D00, #D50000);
        }
        .sl-emergency-medical {
            background: linear-gradient(135deg, #00BCD4, #006064);
        }
        .sl-emergency-security {
            background: linear-gradient(135deg, #FFC107, #F57F17);
        }
        .sl-emergency-disaster {
            background: linear-gradient(135deg, #9C27B0, #4A148C);
        }

        .sl-emergency-sos {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #D50000, #B71C1C);
            min-height: 64px;
            font-size: var(--sl-font-size-lg);
            animation: sl-sos-pulse 2s ease-in-out infinite;
        }

        @keyframes sl-sos-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(213, 0, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(213, 0, 0, 0.5);
            }
        }

        /* ---------- NOTIFICATION PANEL ---------- */
        .sl-notification-item {
            display: flex;
            align-items: flex-start;
            gap: var(--sl-spacing-3);
            padding: var(--sl-spacing-3) var(--sl-spacing-4);
            background: var(--sl-color-card);
            border-radius: var(--sl-radius-md);
            border: 1px solid var(--sl-color-border);
            margin-bottom: var(--sl-spacing-2);
            transition: var(--sl-transition-all);
            cursor: pointer;
        }

        .sl-notification-item:hover {
            border-color: var(--sl-color-border-light);
            background: var(--sl-color-card-hover);
        }

        .sl-notification-item.unread {
            border-left: 4px solid var(--sl-color-primary);
        }

        .sl-notification-icon {
            font-size: var(--sl-font-size-xl);
            flex-shrink: 0;
        }

        .sl-notification-content {
            flex: 1;
        }

        .sl-notification-title {
            font-weight: var(--sl-font-weight-medium);
            color: var(--sl-color-text-primary);
        }

        .sl-notification-message {
            font-size: var(--sl-font-size-sm);
            color: var(--sl-color-text-secondary);
        }

        .sl-notification-time {
            font-size: var(--sl-font-size-xs);
            color: var(--sl-color-text-muted);
            flex-shrink: 0;
        }

        .sl-notification-empty {
            text-align: center;
            padding: var(--sl-spacing-8) 0;
            color: var(--sl-color-text-muted);
        }

        .sl-notification-empty .sl-icon-emoji {
            font-size: 48px;
            display: block;
            margin-bottom: var(--sl-spacing-3);
        }

        /* ---------- BOTTOM NAV ---------- */
        #sl-bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--sl-color-surface);
            border-top: 1px solid var(--sl-color-border);
            padding: var(--sl-spacing-1) 0 var(--sl-spacing-2);
            flex-shrink: 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
            z-index: var(--sl-z-bottom-nav);
        }

        .sl-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            color: var(--sl-color-text-secondary);
            cursor: pointer;
            padding: var(--sl-spacing-1) var(--sl-spacing-3);
            transition: var(--sl-transition-color);
            font-family: var(--sl-font-primary);
            position: relative;
            min-height: var(--sl-touch-target-min);
        }

        .sl-nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sl-nav-item .sl-nav-label {
            font-size: var(--sl-font-size-xs);
            font-weight: var(--sl-font-weight-medium);
            margin-top: 2px;
        }

        .sl-nav-item.active {
            color: var(--sl-color-primary);
        }

        .sl-nav-item.active::after {
            content: "";
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            border-radius: var(--sl-radius-sm);
            background: var(--sl-color-primary);
        }

        .sl-nav-item:hover {
            color: var(--sl-color-text-primary);
        }

        .sl-nav-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--sl-color-danger);
            color: #fff;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: var(--sl-radius-full);
            min-width: 18px;
            text-align: center;
            display: none;
            font-weight: var(--sl-font-weight-bold);
        }

        /* ---------- SIDEBAR ---------- */
        .sl-sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            height: 100dvh;
            background: var(--sl-color-surface);
            border-right: 1px solid var(--sl-color-border);
            z-index: var(--sl-z-sidebar);
            transition: left var(--sl-duration-normal) var(--sl-ease-default);
            padding: var(--sl-spacing-4);
            overflow-y: auto;
        }

        .sl-sidebar.open {
            left: 0;
        }

        .sl-sidebar-overlay {
            position: fixed;
            inset: 0;
            background: var(--sl-color-overlay);
            z-index: var(--sl-z-above);
            display: none;
        }

        .sl-sidebar-overlay.active {
            display: block;
        }

        .sl-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: var(--sl-spacing-4);
            border-bottom: 1px solid var(--sl-color-border);
            margin-bottom: var(--sl-spacing-4);
        }

        .sl-sidebar-close {
            background: none;
            border: none;
            color: var(--sl-color-text-secondary);
            font-size: var(--sl-font-size-xl);
            cursor: pointer;
            padding: var(--sl-spacing-1);
            transition: var(--sl-transition-color);
        }

        .sl-sidebar-close:hover {
            color: var(--sl-color-text-primary);
        }

        .sl-sidebar-user {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-3);
            padding: var(--sl-spacing-3);
            background: var(--sl-color-card);
            border-radius: var(--sl-radius-md);
            margin-bottom: var(--sl-spacing-4);
        }

        .sl-sidebar-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--sl-radius-full);
            background: var(--sl-color-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--sl-font-size-2xl);
            color: var(--sl-color-text-primary);
        }

        .sl-sidebar-username {
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
        }

        .sl-sidebar-user-status {
            font-size: var(--sl-font-size-xs);
            color: var(--sl-color-text-muted);
        }

        .sl-sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sl-sidebar-menu li {
            margin-bottom: var(--sl-spacing-1);
        }

        .sl-sidebar-menu a {
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-3);
            padding: var(--sl-spacing-3) var(--sl-spacing-4);
            border-radius: var(--sl-radius-md);
            color: var(--sl-color-text-secondary);
            text-decoration: none;
            transition: var(--sl-transition-all);
            cursor: pointer;
            font-size: var(--sl-font-size-md);
        }

        .sl-sidebar-menu a:hover {
            background: var(--sl-color-card);
            color: var(--sl-color-text-primary);
        }

        .sl-sidebar-menu a.active {
            background: var(--sl-color-card);
            color: var(--sl-color-primary);
        }

        .sl-sidebar-menu a svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sl-sidebar-footer {
            margin-top: var(--sl-spacing-4);
            padding-top: var(--sl-spacing-4);
            border-top: 1px solid var(--sl-color-border);
        }

        /* ---------- MODAL ---------- */
        .sl-modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--sl-color-overlay);
            z-index: var(--sl-z-modal);
            display: none;
            align-items: center;
            justify-content: center;
            padding: var(--sl-spacing-4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .sl-modal-overlay.active {
            display: flex;
        }

        .sl-modal {
            background: var(--sl-color-surface);
            border-radius: var(--sl-radius-xl);
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: var(--sl-spacing-5);
            border: 1px solid var(--sl-color-border);
            box-shadow: var(--sl-shadow-xl);
            animation: sl-modal-in var(--sl-duration-normal) var(--sl-ease-spring);
        }

        @keyframes sl-modal-in {
            from {
                transform: scale(0.9) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .sl-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--sl-spacing-4);
        }

        .sl-modal-title {
            font-size: var(--sl-font-size-xl);
            font-weight: var(--sl-font-weight-bold);
            color: var(--sl-color-text-primary);
        }

        .sl-modal-close {
            background: none;
            border: none;
            color: var(--sl-color-text-secondary);
            font-size: var(--sl-font-size-2xl);
            cursor: pointer;
            padding: var(--sl-spacing-1);
            transition: var(--sl-transition-color);
        }

        .sl-modal-close:hover {
            color: var(--sl-color-text-primary);
        }

        .sl-modal-body {
            color: var(--sl-color-text-secondary);
            line-height: var(--sl-line-height-normal);
        }

        .sl-modal-footer {
            margin-top: var(--sl-spacing-4);
            padding-top: var(--sl-spacing-4);
            border-top: 1px solid var(--sl-color-border);
            display: flex;
            gap: var(--sl-spacing-2);
            justify-content: flex-end;
        }

        /* ---------- TOAST ---------- */
        .sl-toast-container {
            position: fixed;
            bottom: calc(var(--sl-spacing-4) + 72px);
            left: var(--sl-spacing-4);
            right: var(--sl-spacing-4);
            z-index: var(--sl-z-toast);
            display: flex;
            flex-direction: column;
            gap: var(--sl-spacing-2);
            max-width: 480px;
            margin: 0 auto;
            pointer-events: none;
        }

        .sl-toast {
            padding: var(--sl-spacing-3) var(--sl-spacing-4);
            border-radius: var(--sl-radius-md);
            background: var(--sl-color-card);
            border: 1px solid var(--sl-color-border);
            box-shadow: var(--sl-shadow-lg);
            display: flex;
            align-items: center;
            gap: var(--sl-spacing-3);
            transform: translateY(100px);
            opacity: 0;
            transition: all var(--sl-duration-normal) var(--sl-ease-spring);
            pointer-events: auto;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .sl-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .sl-toast-icon {
            font-size: var(--sl-font-size-xl);
            flex-shrink: 0;
        }

        .sl-toast-content {
            flex: 1;
        }

        .sl-toast-title {
            font-weight: var(--sl-font-weight-bold);
            font-size: var(--sl-font-size-md);
            color: var(--sl-color-text-primary);
        }

        .sl-toast-message {
            font-size: var(--sl-font-size-sm);
            color: var(--sl-color-text-secondary);
        }

        .sl-toast-close {
            background: none;
            border: none;
            color: var(--sl-color-text-muted);
            cursor: pointer;
            font-size: var(--sl-font-size-lg);
            padding: var(--sl-spacing-1);
            transition: var(--sl-transition-color);
        }

        .sl-toast-close:hover {
            color: var(--sl-color-text-primary);
        }

        /* ---------- BUTTONS ---------- */
        .sl-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--sl-spacing-2);
            padding: var(--sl-spacing-2) var(--sl-spacing-4);
            border: none;
            border-radius: var(--sl-radius-md);
            font-family: var(--sl-font-primary);
            font-size: var(--sl-font-size-md);
            font-weight: var(--sl-font-weight-medium);
            cursor: pointer;
            transition: var(--sl-transition-all);
            min-height: var(--sl-touch-target-min);
            text-decoration: none;
            user-select: none;
        }

        .sl-btn-primary {
            background: var(--sl-color-primary);
            color: #fff;
        }
        .sl-btn-primary:hover {
            background: var(--sl-color-primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--sl-shadow-sm);
        }

        .sl-btn-secondary {
            background: var(--sl-color-secondary);
            color: var(--sl-color-text-primary);
        }
        .sl-btn-secondary:hover {
            background: var(--sl-color-secondary-hover);
        }

        .sl-btn-danger {
            background: var(--sl-color-danger);
            color: #fff;
        }
        .sl-btn-danger:hover {
            background: var(--sl-color-danger-hover);
        }

        .sl-btn-sm {
            padding: var(--sl-spacing-1) var(--sl-spacing-3);
            font-size: var(--sl-font-size-sm);
            min-height: 32px;
        }

        .sl-btn-full {
            width: 100%;
            justify-content: center;
        }

        /* ---------- INPUT ---------- */
        .sl-input {
            display: block;
            width: 100%;
            padding: var(--sl-spacing-2) var(--sl-spacing-3);
            font-family: var(--sl-font-primary);
            font-size: var(--sl-font-size-md);
            color: var(--sl-color-text-primary);
            background: var(--sl-color-surface);
            border: 2px solid var(--sl-color-border);
            border-radius: var(--sl-radius-md);
            transition: var(--sl-transition-all);
            min-height: var(--sl-touch-target-min);
        }

        .sl-input::placeholder {
            color: var(--sl-color-text-muted);
        }

        .sl-input:focus {
            outline: none;
            border-color: var(--sl-color-primary);
            box-shadow: 0 0 0 4px rgba(0, 194, 255, 0.1);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 767px) {
            .sl-stats {
                grid-template-columns: repeat(4, 1fr);
                gap: var(--sl-spacing-1);
            }

            .sl-stat-value {
                font-size: var(--sl-font-size-lg);
            }

            .sl-emergency-grid {
                grid-template-columns: 1fr 1fr;
                gap: var(--sl-spacing-3);
            }

            .sl-emergency-btn {
                min-height: 100px;
                padding: var(--sl-spacing-4) var(--sl-spacing-2);
            }

            .sl-emergency-btn .sl-icon-emoji {
                font-size: 36px;
            }

            .sl-quick-action {
                grid-template-columns: repeat(4, 1fr);
            }

            .sl-toast-container {
                bottom: calc(var(--sl-spacing-4) + 72px);
                left: var(--sl-spacing-3);
                right: var(--sl-spacing-3);
            }

            .sl-post-composer-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .sl-post-composer-submit {
                margin-left: 0;
            }

            .sl-post-actions {
                gap: var(--sl-spacing-1);
            }

            .sl-post-action {
                padding: var(--sl-spacing-1);
                font-size: var(--sl-font-size-xs);
            }

            .sl-post-action svg {
                width: 16px;
                height: 16px;
            }
        }

        @media (min-width: 768px) {
            .sl-stats {

    <!-- ============================================================
         ALL JAVASCRIPT IN ONE
         ============================================================ -->
    <script>
        // ================================================================
        // SALINK APPLICATION CORE — Full Citizen App
        // ================================================================

        (function() {
            'use strict';

            // ==================== STATE ====================
            const STATE = {
                theme: 'dark',
                currentWorkspace: 'home',
                isReady: false,
                user: {
                    id: 'usr-001',
                    name: 'Pengguna',
                    username: '@pengguna',
                    avatar: '👤',
                    bio: 'Pengguna SALINK',
                    location: 'Indonesia',
                    joined: 'Januari 2025',
                    posts: 0,
                    followers: 0,
                    following: 0,
                    trustScore: 100,
                    verified: false,
                    online: true
                },
                posts: [],
                notifications: [],
                friends: [],
                pendingInvites: []
            };

            // ==================== STORAGE ====================
            const Storage = {
                prefix: 'sl_',
                set(key, value) {
                    try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); } catch (e) {}
                },
                get(key, defaultValue = null) {
                    try {
                        const raw = localStorage.getItem(this.prefix + key);
                        return raw ? JSON.parse(raw) : defaultValue;
                    } catch (e) { return defaultValue; }
                },
                remove(key) {
                    try { localStorage.removeItem(this.prefix + key); } catch (e) {}
                }
            };

            // ==================== EVENT BUS ====================
            const EventBus = {
                listeners: {},
                on(event, callback) {
                    if (!this.listeners[event]) this.listeners[event] = [];
                    this.listeners[event].push(callback);
                },
                emit(event, data) {
                    if (this.listeners[event]) {
                        this.listeners[event].forEach(cb => { try { cb(data); } catch (e) {} });
                    }
                },
                off(event, callback) {
                    if (this.listeners[event]) {
                        this.listeners[event] = this.listeners[event].filter(cb => cb !== callback);
                    }
                }
            };

            // ==================== THEME MANAGER ====================
            const ThemeManager = {
                current: 'dark',
                init() {
                    const saved = Storage.get('theme', 'dark');
                    this.current = saved;
                    this.apply(this.current);
                    return this;
                },
                toggle() {
                    const themes = ['dark', 'light', 'emergency', 'command-center'];
                    const idx = themes.indexOf(this.current);
                    const next = themes[(idx + 1) % themes.length];
                    this.apply(next);
                    this.current = next;
                    Storage.set('theme', next);
                    EventBus.emit('theme:changed', { theme: next });
                    return next;
                },
                apply(theme) {
                    document.documentElement.setAttribute('data-theme', theme);
                    const btn = document.getElementById('sl-theme-btn');
                    if (btn) {
                        const icons = { dark: '🌙', light: '☀️', emergency: '🚨', 'command-center': '🖥️' };
                        btn.textContent = icons[theme] || '🌙';
                    }
                    const meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) {
                        const colors = { dark: '#071A2E', light: '#F0F4F8', emergency: '#1A0000',
                            'command-center': '#071A2E' };
                        meta.content = colors[theme] || '#071A2E';
                    }
                }
            };

            // ==================== TOAST ====================
            const Toast = {
                container: null,
                init() {
                    this.container = document.getElementById('sl-toast-container');
                    return this;
                },
                show(message, type = 'info', title = '', duration = 3000) {
                    if (!this.container) return;
                    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
                    const titles = { success: 'Berhasil', error: 'Error', warning: 'Peringatan', info: 'Informasi' };
                    const toast = document.createElement('div');
                    toast.className = 'sl-toast';
                    toast.innerHTML = `
                        <span class="sl-toast-icon">${icons[type] || 'ℹ️'}</span>
                        <div class="sl-toast-content">
                            <div class="sl-toast-title">${title || titles[type] || 'Info'}</div>
                            <div class="sl-toast-message">${message}</div>
                        </div>
                        <button class="sl-toast-close">✕</button>
                    `;
                    this.container.appendChild(toast);
                    requestAnimationFrame(() => toast.classList.add('show'));
                    toast.querySelector('.sl-toast-close').addEventListener('click', () => {
                        toast.classList.remove('show');
                        setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
                    });
                    const timer = setTimeout(() => {
                        toast.classList.remove('show');
                        setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
                    }, duration);
                    toast._timer = timer;
                    return toast;
                }
            };

            // ==================== LAYOUT ====================
            const Layout = {
                sidebarOpen: false,
                drawerOpen: false,
                modalOpen: false,

                init() {
                    this._bindSidebar();
                    this._bindDrawer();
                    this._bindModal();
                    this._bindKeyboard();
                    return this;
                },

                _bindSidebar() {
                    const sidebar = document.getElementById('sl-sidebar');
                    const overlay = document.querySelector('.sl-sidebar-overlay');
                    const menuBtn = document.getElementById('sl-menu-btn');
                    const closeBtn = sidebar?.querySelector('.sl-sidebar-close');

                    if (menuBtn) {
                        menuBtn.addEventListener('click', () => this.toggleSidebar());
                    }
                    if (closeBtn) {
                        closeBtn.addEventListener('click', () => this.closeSidebar());
                    }
                    if (overlay) {
                        overlay.addEventListener('click', () => this.closeSidebar());
                    }
                    // Sidebar menu links
                    sidebar?.querySelectorAll('.sl-sidebar-menu a').forEach(link => {
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            const ws = link.dataset.workspace;
                            if (ws) {
                                EventBus.emit('router:navigate', { workspace: ws });
                                this.closeSidebar();
                            }
                        });
                    });
                },

                _bindDrawer() {
                    const drawer = document.getElementById('sl-drawer');
                    const overlay = document.querySelector('.sl-drawer-overlay');
                    const handle = drawer?.querySelector('.sl-drawer-handle');
                    if (handle) {
                        handle.addEventListener('click', () => this.closeDrawer());
                    }
                    if (overlay) {
                        overlay.addEventListener('click', () => this.closeDrawer());
                    }
                },

                _bindModal() {
                    const modal = document.getElementById('sl-modal-overlay');
                    const closeBtn = document.getElementById('sl-modal-close');
                    if (closeBtn) {
                        closeBtn.addEventListener('click', () => this.closeModal());
                    }
                    if (modal) {
                        modal.addEventListener('click', (e) => {
                            if (e.target === modal) this.closeModal();
                        });
                    }
                },

                _bindKeyboard() {
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') {
                            if (this.sidebarOpen) this.closeSidebar();
                            if (this.drawerOpen) this.closeDrawer();
                            if (this.modalOpen) this.closeModal();
                        }
                        if (e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey) {
                            const map = { '1': 'home', '2': 'feed', '3': 'emergency', '4': 'notification',
                                '5': 'profile', '6': 'marketplace', '7': 'settings' };
                            const target = map[e.key];
                            if (target) {
                                e.preventDefault();
                                EventBus.emit('router:navigate', { workspace: target });
                            }
                        }
                        if (e.ctrlKey && e.key === 't') {
                            e.preventDefault();
                            ThemeManager.toggle();
                        }
                    });
                },

                toggleSidebar() {
                    const sidebar = document.getElementById('sl-sidebar');
                    const overlay = document.querySelector('.sl-sidebar-overlay');
                    if (this.sidebarOpen) {
                        this.closeSidebar();
                    } else {
                        sidebar?.classList.add('open');
                        overlay?.classList.add('active');
                        this.sidebarOpen = true;
                        document.body.style.overflow = 'hidden';
                    }
                },

                closeSidebar() {
                    const sidebar = document.getElementById('sl-sidebar');
                    const overlay = document.querySelector('.sl-sidebar-overlay');
                    sidebar?.classList.remove('open');
                    overlay?.classList.remove('active');
                    this.sidebarOpen = false;
                    document.body.style.overflow = '';
                },

                openDrawer(content) {
                    const drawer = document.getElementById('sl-drawer');
                    const overlay = document.querySelector('.sl-drawer-overlay');
                    const contentEl = document.getElementById('sl-drawer-content');
                    if (contentEl && content) contentEl.innerHTML = content;
                    drawer?.classList.add('open');
                    overlay?.classList.add('active');
                    this.drawerOpen = true;
                    document.body.style.overflow = 'hidden';
                },

                closeDrawer() {
                    const drawer = document.getElementById('sl-drawer');
                    const overlay = document.querySelector('.sl-drawer-overlay');
                    drawer?.classList.remove('open');
                    overlay?.classList.remove('active');
                    this.drawerOpen = false;
                    document.body.style.overflow = '';
                },

                openModal(title, body, footer = '') {
                    const modal = document.getElementById('sl-modal-overlay');
                    const titleEl = document.getElementById('sl-modal-title');
                    const bodyEl = document.getElementById('sl-modal-body');
                    const footerEl = document.getElementById('sl-modal-footer');
                    if (titleEl) titleEl.textContent = title;
                    if (bodyEl) bodyEl.innerHTML = body;
                    if (footerEl) footerEl.innerHTML = footer;
                    modal?.classList.add('active');
                    this.modalOpen = true;
                    document.body.style.overflow = 'hidden';
                },

                closeModal() {
                    const modal = document.getElementById('sl-modal-overlay');
                    modal?.classList.remove('active');
                    this.modalOpen = false;
                    document.body.style.overflow = '';
                }

            const WORKSPACES = {
                home: { id: 'home', label: 'Home', icon: '🏠' },
                feed: { id: 'feed', label: 'Feed', icon: '📰' },
                emergency: { id: 'emergency', label: 'Emergency', icon: '🚨' },
                notification: { id: 'notification', label: 'Notifikasi', icon: '🔔' },
                profile: { id: 'profile', label: 'Profil', icon: '👤' },
                marketplace: { id: 'marketplace', label: 'Marketplace', icon: '🛒' },
                settings: { id: 'settings', label: 'Settings', icon: '⚙️' }
            };

            const Router = {
                current: 'home',
                init() {
                    const hash = window.location.hash.replace('#/', '');
                    const initial = WORKSPACES[hash] ? hash : 'home';
                    this.current = initial;
                    window.addEventListener('hashchange', () => {
                        const h = window.location.hash.replace('#/', '');
                        if (WORKSPACES[h] && h !== this.current) {
                            this.navigate(h);
                        }
                    });
                    EventBus.on('router:navigate', ({ workspace }) => {
                        if (WORKSPACES[workspace]) {
                            this.navigate(workspace);
                        }
                    });
                    // Restore last workspace
                    const last = Storage.get('last_workspace', 'home');
                    const target = WORKSPACES[last] ? last : 'home';
                    this.navigate(target);
                    return this;
                },

                navigate(workspaceId) {
                    if (!WORKSPACES[workspaceId]) return;
                    this.current = workspaceId;
                    Storage.set('last_workspace', workspaceId);
                    if (window.location.hash !== `#/${workspaceId}`) {
                        window.location.hash = `#/${workspaceId}`;
                    }
                    EventBus.emit('route:changed', { workspace: workspaceId });
                }
            };

                        <button class="sl-btn sl-btn-danger sl-btn-sm" style="margin-top:var(--sl-spacing-2);" id="sl-logout-btn">🚪 Logout</button>
                    </div>
                `;
            }

            // ==================== MAIN RENDER ====================
            function renderWorkspace(workspaceId) {
                const container = document.getElementById('sl-workspace-content');
                const loader = document.getElementById('sl-loader');
                const errorBoundary = document.getElementById('sl-error-boundary');
                const errorMsg = document.getElementById('sl-error-message');

                errorBoundary.classList.remove('active');
                loader.style.display = 'flex';
                container.style.display = 'none';

                const progressBar = document.getElementById('sl-loader-progress-bar');
                const loaderText = document.getElementById('sl-loader-text');
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 20;
                    if (progress > 90) progress = 90;
                    if (progressBar) progressBar.style.width = progress + '%';
                    if (loaderText) {
                        if (progress < 30) loaderText.textContent = 'Mempersiapkan workspace...';
                        else if (progress < 60) loaderText.textContent = 'Memuat konten...';
                        else if (progress < 80) loaderText.textContent = 'Hampir selesai...';
                        else loaderText.textContent = 'Siap!';
                    }
                }, 80);

                setTimeout(() => {
                    clearInterval(interval);
                    if (progressBar) progressBar.style.width = '100%';

                    try {
                        let content = '';
                        const workspace = WORKSPACES[workspaceId];

                        switch (workspaceId) {
                            case 'home':
                                content = renderHero() + renderStats() + renderCreatePost() + renderStory() +
                                    renderQuickAction() + renderFeed();
                                break;
                            case 'feed':
                                content = renderFeed();
                                break;
                            case 'emergency':
                                content = renderEmergencyWorkspace();
                                break;
                            case 'notification':
                                content = renderNotificationWorkspace();
                                break;
                            case 'profile':
                                content = renderProfileWorkspace();
                                break;
                            case 'marketplace':
                                content = renderMarketplaceWorkspace();
                                break;
                            case 'settings':
                                content = renderSettingsWorkspace();
                                break;
                            default:
                                throw new Error(`Workspace "${workspaceId}" tidak ditemukan`);
                        }

                        container.innerHTML = content;
                        loader.style.display = 'none';
                        container.style.display = 'block';

                        document.querySelectorAll('.sl-nav-item').forEach(el => {
                            el.classList.toggle('active', el.dataset.workspace === workspaceId);
                        });
                        document.querySelectorAll('.sl-sidebar-menu a').forEach(el => {
                            el.classList.toggle('active', el.dataset.workspace === workspaceId);
                        });

                        // Update logo
                        if (workspace) {
                            document.querySelector('#sl-logo').innerHTML = `
                                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                                ${workspace.label}
                            `;
                        }

                        bindWorkspaceEvents(workspaceId);

                        if (workspaceId === 'settings') {
                            setTimeout(renderThemePreview, 100);
                        }

                        updateNotificationBadge();
                        EventBus.emit('workspace:loaded', { workspace: workspaceId });

                    } catch (error) {
                        console.error('[Workspace] Error:', error);
                        errorBoundary.classList.add('active');
                        errorMsg.textContent = error.message || 'Terjadi kesalahan saat memuat workspace.';
                        loader.style.display = 'none';
                        container.style.display = 'none';
                    }
                }, 800);
            }

            // ==================== THEME PREVIEW ====================
            function renderThemePreview() {
                const container = document.getElementById('sl-theme-preview-container');
                if (!container) return;

                const themes = [
                    { id: 'dark', label: 'Dark', icon: '🌙', desc: 'Mode gelap standar' },
                    { id: 'light', label: 'Light', icon: '☀️', desc: 'Mode terang untuk siang hari' },
                    { id: 'emergency', label: 'Emergency', icon: '🚨', desc: 'Mode darurat dengan kontras tinggi' },
                    { id: 'command-center', label: 'Command Center', icon: '🖥️', desc: 'Mode layar besar' }
                ];

                let html = '<div class="sl-theme-grid">';
                themes.forEach(t => {
                    const active = ThemeManager.current === t.id;
                    html += `
                        <div class="sl-theme-preview ${active ? 'active' : ''}" data-theme="${t.id}">
                            <div class="sl-theme-preview-header">
                                <span class="sl-theme-preview-icon">${t.icon}</span>
                                <span class="sl-theme-preview-name">${t.label}</span>
                                <span class="sl-theme-preview-badge">${active ? '✓ Active' : ''}</span>
                            </div>
                            <div class="sl-theme-preview-colors">
                                <div class="sl-color-swatch" style="background:var(--sl-color-bg);"><span>Bg</span></div>
                                <div class="sl-color-swatch" style="background:var(--sl-color-surface);"><span>Surface</span></div>
                                <div class="sl-color-swatch" style="background:var(--sl-color-primary);"><span>Accent</span></div>
                                <div class="sl-color-swatch" style="background:var(--sl-color-text-primary);color:var(--sl-color-bg);"><span>Text</span></div>
                            </div>
                            <div class="sl-theme-preview-desc">${t.desc}</div>
                            <button class="sl-btn sl-btn-primary sl-btn-sm sl-theme-preview-btn" data-theme="${t.id}">Apply</button>
                        </div>
                    `;
                });
                html += '</div>';

                container.innerHTML = html;

                container.querySelectorAll('.sl-theme-preview-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const themeId = btn.dataset.theme;
                        if (themeId) {
                            ThemeManager.apply(themeId);
                            ThemeManager.current = themeId;
                            Storage.set('theme', themeId);
                            renderThemePreview();
                            Toast.show(`Tema diubah ke ${themes.find(t => t.id === themeId)?.label || themeId}`,
                                'success', '🎨');
                        }
                    });
                });
            }

            // ==================== BIND EVENTS ====================
            function bindWorkspaceEvents(workspaceId) {
                // Create Post trigger
                const trigger = document.getElementById('sl-create-post-trigger');
                const composer = document.getElementById('sl-post-composer');
                if (trigger && composer) {
                    trigger.addEventListener('click', () => {
                        composer.classList.toggle('active');
                        if (composer.classList.contains('active')) {
                            document.getElementById('sl-post-input')?.focus();
                        }
                    });
                }

                // Post submit
                const submitBtn = document.getElementById('sl-post-submit');
                const postInput = document.getElementById('sl-post-input');
                const postType = document.getElementById('sl-post-type');

                function handlePostSubmit() {
                    if (!postInput || !postInput.value.trim()) {
                        Toast.show('Silakan tulis sesuatu terlebih dahulu', 'warning', '📝');
                        return;
                    }

                    const type = postType?.value || 'status';
                    const content = postInput.value.trim();
                    const typeLabels = {
                        fire: '🔥 Kebakaran',
                        medical: '🚑 Medis & Kematian',
                        security: '🚓 Keamanan',
                        disaster: '🌪️ Bencana Alam'
                    };

                    const isEmergency = ['fire', 'medical', 'security', 'disaster'].includes(type);
                    const post = {
                        id: 'post-' + Date.now(),
                        author: STATE.user,
                        content: isEmergency ? `🚨 ${typeLabels[type] || type} — ${content}` : content,
                        time: 'baru saja',
                        media: null,
                        likes: 0,
                        comments: 0,
                        shares: 0,
                        bookmarks: 0,
                        emergency: isEmergency ? {
                            type: type,
                            priority: 'critical',
                            status: 'pending'
                        } : null
                    };

                    STATE.posts.unshift(post);
                    STATE.user.posts = (STATE.user.posts || 0) + 1;

                    postInput.value = '';
                    composer?.classList.remove('active');

                    if (isEmergency) {
                        Toast.show(`🚨 Laporan ${typeLabels[type] || type} terkirim! Bantuan sedang diproses.`, 'error',
                            '🚨');
                        STATE.notifications.unshift({
                            id: 'notif-' + Date.now(),
                            icon: '🚨',
                            title: `🚨 Laporan ${typeLabels[type] || type} terkirim`,
                            message: `📍 ${STATE.user.location || 'Lokasi tidak diketahui'}`,
                            time: 'baru saja',
                            read: false
                        });
                        updateNotificationBadge();
                    } else {
                        Toast.show('Postingan berhasil dibagikan!', 'success', '📝');
                    }

                    renderWorkspace('feed');
                    EventBus.emit('post:created', { post });
                }

                if (submitBtn) {
                    submitBtn.addEventListener('click', handlePostSubmit);
                }
                if (postInput) {
                    postInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            handlePostSubmit();
                        }
                    });
                }

                // Like
                document.querySelectorAll('.sl-post-action[data-action="like"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const postId = this.dataset.post;
                        const post = STATE.posts.find(p => p.id === postId);
                        if (post) {
                            post.likes = (post.likes || 0) + 1;
                            const count = this.querySelector('.sl-action-count');
                            if (count) count.textContent = post.likes;
                            this.classList.add('liked');
                            Toast.show('Anda menyukai postingan ini', 'success', '❤️');
                        }
                    });
                });

                // Comment
                document.querySelectorAll('.sl-post-action[data-action="comment"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        Toast.show('Fitur komentar akan segera hadir!', 'info', '💬');
                    });
                });

                // Share
                document.querySelectorAll('.sl-post-action[data-action="share"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const postId = this.dataset.post;
                        const post = STATE.posts.find(p => p.id === postId);
                        if (post) {
                            post.shares = (post.shares || 0) + 1;
                            const count = this.querySelector('.sl-action-count');
                            if (count) count.textContent = post.shares;
                            const text = `📢 ${post.content.substring(0, 80)}...\n\nBagikan via SALINK!`;
                            if (navigator.share) {
                                navigator.share({ title: 'Postingan SALINK', text: text })
