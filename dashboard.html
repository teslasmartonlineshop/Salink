                            } else {
                                navigator.clipboard.writeText(text)

                });

                // Bookmark

                // Quick Action buttons

                // SOS
                const sosBtn = document.getElementById('sl-sos-btn');

                    sosBtn.addEventListener('click', function() {

                                id: 'notif-' + Date.now(),

                                title: '🚨 SOS DARURAT',
                                message: `📍 ${STATE.user.location || 'Lokasi tidak diketahui'} — Segera bantuan!`,
                                time: 'baru saja',
                                read: false
                            });
                            updateNotificationBadge();
                        }
                    });
                }

                // Filter
                document.querySelectorAll('.sl-feed-filter').forEach(filter => {
                    filter.addEventListener('click', function() {

                // Notification item click
                document.querySelectorAll('.sl-notification-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const id = this.dataset.notifId;
                        if (id) {

                        STATE.notifications.forEach(n => n.read = true);
                        updateNotificationBadge();

                        renderWorkspace('notification');

                            'active'));
                        this.classList.add('active');
                        const tabName = this.dataset.tab;
                        const content = document.getElementById('sl-profile-content');
                        if (content) {
                            if (tabName === 'posts') {
                                const userPosts = STATE.posts.filter(p => p.author.id === STATE.user.id);
                                if (userPosts.length === 0) {
                                    content.innerHTML = `
                                        <div class="sl-notification-empty">
                                            <span class="sl-icon-emoji">📭</span>
                                            <p>Belum ada postingan.</p>

                                            <div class="sl-post-content">${p.content}</div>
                                            <div class="sl-post-actions">
                                                <span style="color:var(--sl-color-text-muted);font-size:var(--sl-font-size-sm);">❤️ ${p.likes || 0}</span>
                                                <span style="color:var(--sl-color-text-muted);font-size:var(--sl-font-size-sm);">💬 ${p.comments || 0}</span>
                                                <span style="color:var(--sl-color-text-muted);font-size:var(--sl-font-size-sm);">↗️ ${p.shares || 0}</span>

                            </div>

                        }
                    });

                // Theme preview button in settings
                const themePreviewBtn = document.getElementById('sl-theme-preview-btn');
                if (themePreviewBtn) {
                    themePreviewBtn.addEventListener('click', () => {

            // ==================== NOTIFICATION BADGE ====================
            function updateNotificationBadge() {
                const unread = STATE.notifications.filter(n => !n.read).length;
                const badge = document.getElementById('sl-notif-count');
                if (badge) {
                    badge.textContent = unread;
                    badge.style.display = unread > 0 ? 'inline-flex' : 'none';
                }
            }

            // ==================== SYSTEM BAR ====================
            function updateSystemStatus() {
                const status = document.getElementById('sl-status-text');
                const online = navigator.onLine;
                if (status) {
                    status.textContent = online ? '● Online' : '● Offline';
                    status.style.color = online ? 'var(--sl-color-success)' : 'var(--sl-color-danger)';
                }
            }

            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const display = document.getElementById('sl-time-display');
                if (display) display.textContent = `${h}:${m}`;
            }

            // ==================== SEARCH ====================
            function toggleSearch() {
                const bar = document.getElementById('sl-search-bar');
                bar.classList.toggle('active');
                if (bar.classList.contains('active')) {
                    document.getElementById('sl-search-input')?.focus();
                }
            }

            // ==================== GLOBAL EVENTS ====================
            function bindGlobalEvents() {
                // Search
                document.getElementById('sl-search-btn')?.addEventListener('click', toggleSearch);
                document.getElementById('sl-search-input')?.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        document.getElementById('sl-search-bar')?.classList.remove('active');
                    }
                });

                // Theme
                document.getElementById('sl-theme-btn')?.addEventListener('click', () => {
                    ThemeManager.toggle();
                    Toast.show(`Tema: ${ThemeManager.current}`, 'info', '🎨');
                });

                // FAB
                document.getElementById('sl-fab')?.addEventListener('click', () => {
                    const current = Router.current;
                    if (current === 'home' || current === 'feed') {
                        const composer = document.getElementById('sl-post-composer');
                        if (composer) {
                            composer.classList.toggle('active');
                            if (composer.classList.contains('active')) {
                                document.getElementById('sl-post-input')?.focus();
                            }
                        }
                    } else if (current === 'profile') {
                        document.getElementById('profile-edit-btn')?.click();
                    } else if (current === 'marketplace') {
                        document.getElementById('sl-add-product')?.click();
                    } else if (current === 'emergency') {
                        document.getElementById('sl-sos-btn')?.click();
                    } else {
                        EventBus.emit('router:navigate', { workspace: 'home' });
                        setTimeout(() => {
                            document.getElementById('sl-post-input')?.focus();
                        }, 300);
                    }
                });

                // Online/Offline
                window.addEventListener('online', updateSystemStatus);
                window.addEventListener('offline', updateSystemStatus);

                // Clock
                setInterval(updateClock, 10000);
                updateClock();

                // Route changes
                EventBus.on('route:changed', ({ workspace }) => {
                    renderWorkspace(workspace);
                });
            }

            // ==================== BOOTSTRAP ====================
            function bootstrap() {
                console.log('[SALINK] 🚀 Initializing...');

                try {
                    // Theme
                    ThemeManager.init();
                    console.log('[SALINK] ✅ Theme Engine ready');

                    // Toast
                    Toast.init();
                    console.log('[SALINK] ✅ Toast ready');

                    // Layout
                    Layout.init();
                    console.log('[SALINK] ✅ Layout Engine ready');

                    // Router
                    Router.init();
                    console.log('[SALINK] ✅ Router Engine ready');

                    // Global events
                    bindGlobalEvents();

                    // System status
                    updateSystemStatus();

                    // Notification badge
                    updateNotificationBadge();

                    // Hide splash
                    setTimeout(() => {
                        document.getElementById('sl-splash')?.classList.add('hide');
                        setTimeout(() => {
                            document.getElementById('sl-splash')?.remove();
                        }, 500);
                    }, 1500);

                    // Render initial workspace
                    const initial = Router.current;
                    renderWorkspace(initial);

                    STATE.isReady = true;
                    console.log('[SALINK] ✅ Application ready');
                    console.log('[SALINK] 🎉 SALINK Citizen App v1.0 ready');

                    EventBus.emit('app:ready', {
                        timestamp: new Date().toISOString(),
                        version: '1.0',
                        theme: ThemeManager.current,
                        workspace: Router.current
                    });

                } catch (error) {
                    console.error('[SALINK] ❌ Bootstrap error:', error);
                    Toast.show('Terjadi kesalahan saat memuat aplikasi', 'error', '⚠️');
                }
            }

            // ==================== START ====================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', bootstrap);
            } else {
                bootstrap();
            }

            // Expose for debugging
            window.__SALINK = {
                STATE,
                EventBus,
                Storage,
                ThemeManager,
                Toast,
                Layout,
                Router,
                WORKSPACES,
                renderWorkspace,
                renderThemePreview
            };

        })();
    </script>

</body>
</html>
